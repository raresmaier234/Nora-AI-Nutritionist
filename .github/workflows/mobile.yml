# Publishes the mobile app's JS as an EAS Update on every push that touches it: master to the
# "development" update branch, main (merged from master) to "production". An update opens in
# Expo Go (QR code on the update's page at expo.dev) and in any build on the channel of the same
# name (eas.json: "preview" builds follow development, "production" builds follow production).
#
# Needs in GitHub:
#   secret   EXPO_TOKEN — an Expo access token (expo.dev → Account settings → Access tokens)
#   variable API_URL    — in each environment, that environment's public API base URL
name: Mobile

on:
  push:
    branches: [main, master]
    paths: ["apps/mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["apps/mobile/**", ".github/workflows/mobile.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  publish:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    concurrency:
      group: mobile-publish-${{ github.ref_name }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 27.1.0
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: eas update --branch "$EAS_BRANCH" --message "$COMMIT_MESSAGE" --non-interactive
        env:
          EAS_BRANCH: ${{ github.ref_name == 'main' && 'production' || 'development' }}
          EXPO_PUBLIC_API_URL: ${{ vars.API_URL }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
