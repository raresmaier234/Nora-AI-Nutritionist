# Local PostgreSQL only — for running the app against a real database without installing
# PostgreSQL directly. The app itself is not containerized here; run it with uvicorn.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nora
      POSTGRES_PASSWORD: nora
      POSTGRES_DB: nora
    ports:
      - "5432:5432"
    volumes:
      - nora_postgres_data:/var/lib/postgresql/data

volumes:
  nora_postgres_data:
