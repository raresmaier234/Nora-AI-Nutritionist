<!-- @dsCard group="Components" viewport="700x1340" name="Food Icon Library" subtitle="All 184 food icons, grouped by the 10 categories" -->
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" data-identity="v2" style="background:var(--bg-app);padding:16px 20px"></div>
<script type="text/babel">
const NS = window.NoraDesignSystem_a9ff6f || {};
const { FoodIcon } = NS;
const CATS = (NS.FOOD_CATEGORIES || []).filter(c => Array.isArray(c.items) && c.items.length);
function Demo(){
  if (!FoodIcon || !CATS.length) return <div style={{font:'13px var(--font-sans)',color:'var(--text-tertiary)'}}>Food icon library loads once the design system bundle is rebuilt.</div>;
  const total = CATS.reduce((a,c)=>a+c.items.length,0);
  return (
    <div style={{fontFamily:'var(--font-sans)',display:'flex',flexDirection:'column',gap:12}}>
      <div style={{font:'var(--weight-bold) 11px/1 var(--font-sans)',color:'var(--text-tertiary)',letterSpacing:'0.08em',textTransform:'uppercase'}}>{total} icons · {CATS.length} categories</div>
      {CATS.map(c => (
        <div key={c.id} style={{display:'flex',gap:12,alignItems:'flex-start'}}>
          <div style={{width:92,flexShrink:0,paddingTop:8,font:'var(--weight-bold) 11px/1.2 var(--font-sans)',color:'var(--text-primary)'}}>{c.label}<div style={{font:'var(--weight-medium) 10px/1 var(--font-sans)',color:'var(--text-tertiary)',marginTop:3}}>{c.items.length}</div></div>
          <div style={{display:'flex',flexWrap:'wrap',gap:6,flex:1}}>
            {c.items.map(it => (
              <div key={it.name} title={it.name} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:3,width:44}}>
                <FoodIcon name={it.name} category={c.id} size={34} />
                <span style={{font:'var(--weight-medium) 8.5px/1.1 var(--font-sans)',color:'var(--text-tertiary)',textAlign:'center',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',width:44}}>{it.name}</span>
              </div>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
