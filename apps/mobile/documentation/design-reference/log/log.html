const { FloatingNav } = window.NoraDesignSystem_a9ff6f;
function Toast({ tone, message, onDone }) {
  React.useEffect(() => { const t = setTimeout(onDone, 2400); return () => clearTimeout(t); }, [onDone, message]);
  const err = tone === 'error';
  return (
    <div className="v2-glass n-toast" style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '9px 18px 9px 9px', borderRadius: 'var(--radius-pill)', boxShadow: 'var(--shadow-3)', maxWidth: 320 }}>
      <div style={{ width: 32, height: 32, borderRadius: '50%', background: err ? 'var(--grad-apricot)' : 'var(--grad-violet)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff', flexShrink: 0 }}>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5" /></svg>
      </div>
      <span style={{ font: 'var(--weight-bold) var(--text-small)/1.3 var(--font-sans)', color: 'var(--text-primary)' }}>{message}</span>
    </div>
  );
}
function LogApp() {
  const [toast, setToast] = React.useState(null);
  const [tab, setTab] = React.useState('log');
  return (
    <div data-identity="v2" style={{ width: 390, height: 844, margin: '0 auto', position: 'relative', overflow: 'hidden', background: 'var(--bg-app)', fontFamily: 'var(--font-sans)' }}>
      <div style={{ position: 'absolute', inset: 0, overflowY: 'auto', paddingBottom: 116 }}>
        <LogPageV3 onNotify={(tone, message) => setToast({ tone, message, id: Date.now() })} />
      </div>
      {toast && (
        <div style={{ position: 'absolute', left: 0, right: 0, bottom: 104, display: 'flex', justifyContent: 'center', zIndex: 45, pointerEvents: 'none' }}>
          <Toast key={toast.id} tone={toast.tone} message={toast.message} onDone={() => setToast(null)} />
        </div>
      )}
      <div style={{ position: 'absolute', left: 18, right: 18, bottom: 22, zIndex: 30 }}>
        <FloatingNav active={tab} onSelect={setTab} />
      </div>
      <div id="nora-overlay" style={{ position: 'absolute', inset: 0, zIndex: 60, pointerEvents: 'none' }}></div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<LogApp />);
</script>
