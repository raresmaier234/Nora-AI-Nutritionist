# Railway service config (https://docs.railway.com/reference/config-as-code). Deploys are
# triggered from GitHub Actions (.github/workflows/api.yml), not from Railway's own repo watch.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = ["alembic upgrade head"]
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
